[package]
name = "forge-pm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
futures-util = "0.3"
indicatif = "0.17"
clap = { version = "4.6.7", features = ["derive"] }
